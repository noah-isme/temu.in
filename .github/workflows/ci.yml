name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: temu_in_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d temu_in_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Job-level so every step (tests and the coverage gate) sees them. The
    # postgres superuser can CREATE DATABASE, which testutil needs for its
    # per-package databases. REQUIRE_INTEGRATION turns a skipped integration
    # test into a failure. No Redis service: Redis tests use miniredis.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/temu_in_test?sslmode=disable
      REQUIRE_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (unit + integration, with coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate
        run: ./scripts/coverage-check.sh coverage.out
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore
      - name: Migration smoke test
        env:
          APP_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/temu_in_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret
        run: go run ./cmd/migrate

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@1 lint --config backend/openapi/redocly.yaml backend/openapi/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Runtime dependencies must have no high/critical advisories; dev-only
      # leftovers are triaged in docs/progress-report.md ("Dependency audit").
      - run: npm audit --omit=dev --audit-level=high
      # The generated API client must be committed and match the spec.
      - name: Check generated API client is up to date
        run: |
          git ls-files --error-unmatch src/api/schema.ts
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  # Security jobs (step 33). All three must stay green; triage notes live in
  # docs/progress-report.md ("Dependency audit") and .trivyignore.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend
          go-package: ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      # Uses .gitleaks.toml at the repo root (default ruleset + documented
      # allowlist). Organisation-owned repos need a GITLEAKS_LICENSE secret;
      # without one, replace this step with the docker fallback:
      #   docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
      #     detect -s /repo -c /repo/.gitleaks.toml -v
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
